    <!-- Google tag (gtag.js) — deferred to avoid blocking first paint on slow connections -->
    <script>
      // Load analytics after first paint via requestIdleCallback (or 3s timeout fallback)
      (function() {
        function loadGA() {
          var s = document.createElement('script');
          s.src = 'https://www.googletagmanager.com/gtag/js?id=G-72E9Z3HM9S';
          s.async = true;
          document.head.appendChild(s);
          window.dataLayer = window.dataLayer || [];
          function gtag(){dataLayer.push(arguments);}
          window.gtag = gtag;
          gtag('js', new Date());
          gtag('config', 'G-72E9Z3HM9S');
        }
        if ('requestIdleCallback' in window) {
          requestIdleCallback(loadGA, { timeout: 3000 });
        } else {
          setTimeout(loadGA, 3000);
        }
      })();
    </script>

      }

      /* Hide app shell once React mounts */
      #root:not(:empty) .app-shell {
        display: none;
      }

    <!-- Force-clear stale service workers on new deployments -->
    <script>
      // Enhanced service worker registration
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', async () => {
          try {
            const registration = await navigator.serviceWorker.register('/sw.js', {
              scope: '/'
            });
            
            // Handle updates
            registration.addEventListener('updatefound', () => {
              const newWorker = registration.installing;
              if (newWorker) {
                newWorker.addEventListener('statechange', () => {
                  if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                    // New version available
                    console.log('[SW] New version available');
                  }
                });
              }
            });
            
            console.log('[SW] Service Worker registered');
          } catch (error) {
            console.error('[SW] Registration failed:', error);
          }
        });
      }
    </script>
